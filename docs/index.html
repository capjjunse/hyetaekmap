<meta charset="UTF-8">
<title>혜택맵 — 통신사 멤버십 지도 프로토타입</title>
<style>
  :root {
    --ink: #1c1b22;
    --ink-soft: #4a4854;
    --paper: #fbf8f2;
    --parchment: #efe6d4;
    --map-bg: #efe6d4;
    --map-road: #fbf8f2;
    --map-block: #e2d6ba;
    --map-park: #b9c9a6;
    --map-water: #a7c7c9;
    --teal: #1f6f63;
    --teal-ink: #16463d;
    --skt: #e2183c;
    --kt: #ff7a00;
    --lgu: #e6007e;
    --border: rgba(28, 27, 34, 0.1);
    --chrome: #1c1b22;
    --shadow: rgba(20, 18, 24, 0.28);
    --sheet-bg: #fffdf8;
    --muted: #857f70;
    --disabled: #dcd5c4;
    --disabled-ink: #a8a08d;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f1eee6;
      --ink-soft: #b9b4a8;
      --paper: #111015;
      --parchment: #262b33;
      --map-bg: #23272f;
      --map-road: #2f353e;
      --map-block: #2a2f38;
      --map-park: #24402f;
      --map-water: #1a3646;
      --teal: #4fb3a2;
      --teal-ink: #bdeee3;
      --skt: #ff5674;
      --kt: #ffa64d;
      --lgu: #ff5fb0;
      --border: rgba(241, 238, 230, 0.16);
      --chrome: #242229;
      --shadow: rgba(0, 0, 0, 0.6);
      --sheet-bg: #2c2a33;
      --muted: #9a9488;
      --disabled: #2a2822;
      --disabled-ink: #6b6659;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ink: #f1eee6; --ink-soft: #b9b4a8; --paper: #111015; --parchment: #262b33;
    --map-bg: #23272f; --map-road: #2f353e; --map-block: #2a2f38; --map-park: #24402f; --map-water: #1a3646;
    --teal: #4fb3a2; --teal-ink: #bdeee3; --skt: #ff5674; --kt: #ffa64d; --lgu: #ff5fb0;
    --border: rgba(241, 238, 230, 0.16); --chrome: #242229; --shadow: rgba(0, 0, 0, 0.6);
    --sheet-bg: #2c2a33; --muted: #9a9488; --disabled: #2a2822; --disabled-ink: #6b6659;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --ink: #1c1b22; --ink-soft: #4a4854; --paper: #fbf8f2; --parchment: #efe6d4;
    --map-bg: #efe6d4; --map-road: #fbf8f2; --map-block: #e2d6ba; --map-park: #b9c9a6; --map-water: #a7c7c9;
    --teal: #1f6f63; --teal-ink: #16463d; --skt: #e2183c; --kt: #ff7a00; --lgu: #e6007e;
    --border: rgba(28, 27, 34, 0.1); --chrome: #1c1b22; --shadow: rgba(20, 18, 24, 0.28);
    --sheet-bg: #fffdf8; --muted: #857f70; --disabled: #dcd5c4; --disabled-ink: #a8a08d;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", Pretendard, Malgun Gothic, sans-serif;
    color: var(--ink);
  }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .stage-label { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

  /* ---------- phone frame ---------- */
  .phone {
    width: 375px; height: 812px; max-width: 92vw; max-height: 88vh;
    aspect-ratio: 375 / 812;
    background: var(--chrome);
    border-radius: 52px; padding: 14px;
    box-shadow: 0 40px 80px -24px var(--shadow), 0 2px 0 var(--border) inset;
    position: relative;
  }

  .screen {
    position: relative; width: 100%; height: 100%;
    background: var(--map-bg);
    border-radius: 38px; overflow: hidden;
    display: flex; flex-direction: column;
  }

  .notch {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 120px; height: 26px; background: var(--chrome);
    border-radius: 0 0 16px 16px; z-index: 40;
  }

  /* ---------- status bar ---------- */
  .statusbar {
    height: 44px; flex: 0 0 auto;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 26px 6px; font-size: 13px; font-weight: 600;
    font-variant-numeric: tabular-nums; color: var(--ink);
    z-index: 30; position: relative;
  }
  .statusbar .icons { display: flex; gap: 5px; align-items: center; }
  .statusbar svg { display: block; }

  /* ---------- app body: swappable views ---------- */
  .appbody { position: relative; flex: 1 1 auto; min-height: 0; }
  .view { position: absolute; inset: 0; display: none; flex-direction: column; min-height: 0; }
  .view.active { display: flex; }

  /* ---------- header: search + filters (map view) ---------- */
  .header {
    flex: 0 0 auto; padding: 6px 14px 10px;
    display: flex; flex-direction: column; gap: 10px;
    background: linear-gradient(to bottom, var(--paper) 0%, var(--paper) 60%, transparent 100%);
    position: relative; z-index: 20;
  }

  .searchrow { display: flex; align-items: center; gap: 8px; }
  .searchbox {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: var(--sheet-bg); border: 1px solid var(--border);
    border-radius: 999px; padding: 9px 14px; box-shadow: 0 4px 14px var(--shadow);
  }
  .searchbox svg { flex: 0 0 auto; color: var(--muted); }
  .searchbox input {
    border: none; outline: none; background: transparent;
    font-size: 14px; color: var(--ink); width: 100%; font-family: inherit;
  }
  .searchbox input::placeholder { color: var(--muted); }

  .iconbtn {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
    background: var(--sheet-bg); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink); box-shadow: 0 4px 14px var(--shadow);
  }

  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
  .chips::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto; font-size: 12.5px; font-weight: 700;
    padding: 7px 14px; border-radius: 999px;
    border: 1.4px solid var(--border); background: var(--sheet-bg); color: var(--ink-soft);
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: transform 120ms ease, background 120ms ease, color 120ms ease, border-color 120ms ease;
  }
  .chip:active { transform: scale(0.96); }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-soft); }
  .chip[data-carrier="SKT"] .dot { background: var(--skt); }
  .chip[data-carrier="KT"] .dot { background: var(--kt); }
  .chip[data-carrier="LGU"] .dot { background: var(--lgu); }
  .chip[data-carrier="ALL"].active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chip[data-carrier="SKT"].active { background: var(--skt); color: #fff; border-color: var(--skt); }
  .chip[data-carrier="KT"].active { background: var(--kt); color: #241300; border-color: var(--kt); }
  .chip[data-carrier="LGU"].active { background: var(--lgu); color: #fff; border-color: var(--lgu); }
  .chip.active .dot { background: currentColor; }
  .chip.chip-active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .benefit-tier { font-size: 10.5px; font-weight: 600; color: var(--muted); margin-left: 5px; }
  .bc-cat-label {
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.02em;
    color: var(--ink); margin-top: 10px; margin-bottom: 3px;
    display: flex; align-items: center; gap: 6px;
  }
  .bc-cat-label:first-of-type { margin-top: 2px; }
  .bc-cat-label::before { content: ''; width: 3px; height: 11px; border-radius: 2px; background: var(--teal); display: inline-block; }

  /* ---------- map (카카오맵) ---------- */
  .map { position: relative; flex: 1 1 auto; overflow: hidden; }
  #kakaoMap { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map-loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--map-bg); color: var(--muted); font-size: 13px; font-weight: 600; z-index: 5;
  }
  .map-loading.hidden { display: none; }
  .map.list-mode #kakaoMap,
  .map.list-mode .fabs,
  .map.list-mode .resultpill { display: none; }

  .map-pin {
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer; transition: opacity 160ms ease, filter 160ms ease;
  }
  .map-pin .chip {
    display: flex; align-items: center; gap: 5px;
    background: var(--sheet-bg); border: 1.5px solid var(--border);
    border-radius: 999px; padding: 5px 11px 5px 7px;
    box-shadow: 0 5px 12px var(--shadow);
    font-size: 11.5px; font-weight: 800; color: var(--ink); white-space: nowrap;
  }
  .map-pin .chip-dots { display: flex; gap: 2px; flex: 0 0 auto; }
  .map-pin .chip-dots span { width: 6px; height: 6px; border-radius: 50%; display: block; }
  .map-pin .pointer {
    width: 0; height: 0; margin-top: -1px;
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-top: 7px solid var(--sheet-bg);
    filter: drop-shadow(0 3px 2px var(--shadow));
  }
  .map-pin.selected .chip { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .map-pin.selected .pointer { border-top-color: var(--ink); }

  .viewToggle {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 16;
    display: flex; align-items: center; gap: 6px;
    background: var(--ink); color: var(--paper);
    padding: 9px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
    cursor: pointer; box-shadow: 0 6px 16px var(--shadow); border: none;
  }

  .listpanel { position: absolute; inset: 0; background: var(--paper); overflow-y: auto; padding: 60px 14px 90px; display: none; z-index: 10; }
  .map.list-mode .listpanel { display: block; }

  .listrow, .fav-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 8px;
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .listrow:last-child, .fav-row:last-child { border-bottom: none; }
  .lr-icon {
    width: 40px; height: 40px; border-radius: 12px; background: var(--parchment);
    display: flex; align-items: center; justify-content: center; font-size: 19px; flex: 0 0 auto;
  }
  .lr-text { flex: 1; min-width: 0; }
  .lr-name { font-size: 13.5px; font-weight: 700; }
  .lr-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .lr-dots { display: flex; gap: 3px; flex: 0 0 auto; }
  .lr-dots span { width: 6px; height: 6px; border-radius: 50%; display: block; }
  .lr-chevron { flex: 0 0 auto; color: var(--muted); }

  .fabs { position: absolute; right: 14px; bottom: 18px; display: flex; flex-direction: column; gap: 10px; z-index: 15; }
  .fab {
    width: 42px; height: 42px; border-radius: 50%; background: var(--sheet-bg);
    border: 1px solid var(--border); box-shadow: 0 6px 16px var(--shadow);
    display: flex; align-items: center; justify-content: center; color: var(--ink);
  }
  .fab.locate { color: var(--teal); }

  .resultpill {
    position: absolute; left: 14px; bottom: 18px;
    background: var(--sheet-bg); border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 14px; font-size: 12px; font-weight: 700; color: var(--ink-soft);
    box-shadow: 0 6px 16px var(--shadow); z-index: 15;
  }
  .resultpill b { color: var(--teal-ink); font-variant-numeric: tabular-nums; }

  /* ---------- 혜택 / MY screen shared bits ---------- */
  .subheader { flex: 0 0 auto; padding: 16px 18px 6px; }
  .screen-title { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; }
  .screen-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }

  .view-benefits .chips { flex: 0 0 auto; padding: 10px 18px; }
  .benefit-list, .my-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .benefit-list { padding: 4px 14px 90px; display: flex; flex-direction: column; gap: 10px; }
  .my-scroll { padding: 6px 18px 90px; display: flex; flex-direction: column; gap: 22px; }

  .benefit-card {
    display: flex; gap: 12px; padding: 12px; border: 1px solid var(--border);
    border-radius: 16px; background: var(--sheet-bg); cursor: pointer;
  }
  .bc-icon {
    width: 42px; height: 42px; border-radius: 12px; background: var(--parchment);
    display: flex; align-items: center; justify-content: center; font-size: 20px; flex: 0 0 auto;
  }
  .bc-body { flex: 1; min-width: 0; }
  .bc-name { font-size: 13.5px; font-weight: 700; }
  .bc-meta { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .bc-carriers { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .bc-tag {
    font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 10px; line-height: 1.4;
    background: var(--parchment); color: var(--ink-soft); border: 1px solid transparent;
  }
  .bc-tag b { font-weight: 800; }
  .bc-tag.c-SKT { background: color-mix(in srgb, var(--skt) 13%, var(--sheet-bg)); border-color: color-mix(in srgb, var(--skt) 35%, transparent); }
  .bc-tag.c-SKT b { color: var(--skt); }
  .bc-tag.c-KT  { background: color-mix(in srgb, var(--kt) 15%, var(--sheet-bg));  border-color: color-mix(in srgb, var(--kt) 35%, transparent); }
  .bc-tag.c-KT b  { color: color-mix(in srgb, var(--kt) 70%, black); }
  .bc-tag.c-LGU { background: color-mix(in srgb, var(--lgu) 13%, var(--sheet-bg)); border-color: color-mix(in srgb, var(--lgu) 35%, transparent); }
  .bc-tag.c-LGU b { color: var(--lgu); }
  .bc-tag.mine.c-SKT { background: var(--skt); border-color: var(--skt); color: #fff; }
  .bc-tag.mine.c-SKT b { color: #fff; }
  .bc-tag.mine.c-KT { background: var(--kt); border-color: var(--kt); color: #241300; }
  .bc-tag.mine.c-KT b { color: #241300; }
  .bc-tag.mine.c-LGU { background: var(--lgu); border-color: var(--lgu); color: #fff; }
  .bc-tag.mine.c-LGU b { color: #fff; }

  .fav-empty {
    font-size: 12.5px; color: var(--muted); padding: 20px 14px; text-align: center;
    background: var(--sheet-bg); border: 1.4px dashed var(--border); border-radius: 14px; line-height: 1.6;
  }
  .fav-remove {
    margin-left: auto; width: 26px; height: 26px; border-radius: 50%; border: none;
    background: var(--disabled); color: var(--disabled-ink); font-size: 15px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto;
  }

  .my-section .section-label { padding: 0 2px; }

  /* ---------- carrier picker (onboarding + MY) ---------- */
  .carrier-cards { display: flex; flex-direction: column; gap: 10px; }
  .carrier-card {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    border-radius: 16px; border: 1.6px solid var(--border); background: var(--sheet-bg);
    cursor: pointer; text-align: left; width: 100%; font: inherit; color: var(--ink);
    transition: border-color 140ms ease, background 140ms ease;
  }
  .carrier-card.selected { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--sheet-bg)); }
  .cc-badge {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; color: #fff;
  }
  .cc-name { font-size: 14px; font-weight: 700; flex: 1; }
  .cc-check {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
    border: 1.6px solid var(--border); display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .carrier-card.selected .cc-check { background: var(--c); border-color: var(--c); }

  /* ---------- bottom tab bar ---------- */
  .tabbar {
    flex: 0 0 auto; display: flex; border-top: 1px solid var(--border);
    background: var(--paper); padding: 8px 6px 12px; z-index: 25; position: relative;
  }
  .tabitem {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10.5px; font-weight: 600; color: var(--muted); background: none; border: none; font-family: inherit; cursor: pointer;
  }
  .tabitem.active { color: var(--teal-ink); }

  /* ---------- bottom sheet (overlays every tab) ---------- */
  .sheet-backdrop {
    position: absolute; inset: 0; background: color-mix(in srgb, var(--ink) 40%, transparent);
    opacity: 0; pointer-events: none; transition: opacity 220ms ease; z-index: 45;
  }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }

  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; background: var(--sheet-bg);
    border-radius: 24px 24px 0 0; box-shadow: 0 -12px 30px var(--shadow);
    transform: translateY(100%); transition: transform 260ms cubic-bezier(.2,.8,.3,1);
    z-index: 50; max-height: 74%; display: flex; flex-direction: column;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle { display: flex; justify-content: center; padding: 10px 0 4px; flex: 0 0 auto; }
  .sheet-handle span { width: 36px; height: 4px; border-radius: 4px; background: var(--border); }
  .sheet-scroll { overflow-y: auto; padding: 4px 20px 24px; }

  .place-head { display: flex; gap: 12px; align-items: flex-start; padding: 6px 0 14px; }
  .place-icon {
    flex: 0 0 auto; width: 46px; height: 46px; border-radius: 14px; background: var(--parchment);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .place-titlewrap { flex: 1; min-width: 0; }
  .place-name { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
  .place-meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .fav-btn {
    flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%;
    border: 1.4px solid var(--border); background: var(--sheet-bg); color: var(--muted);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .fav-btn.active { color: #fff; background: var(--teal); border-color: var(--teal); }

  .section-label {
    font-size: 12px; font-weight: 800; letter-spacing: 0.02em;
    color: var(--ink); margin: 14px 0 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .section-label:first-child { margin-top: 4px; }
  .section-label::before { content: ''; width: 3px; height: 12px; border-radius: 2px; background: var(--teal); display: inline-block; }

  .benefit-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .benefit-row:first-of-type { border-top: none; }
  .carrier-badge {
    flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 11.5px; color: #fff; letter-spacing: -0.02em;
  }
  .benefit-row.disabled .carrier-badge { background: var(--disabled) !important; color: var(--disabled-ink); }
  .benefit-info { flex: 1; min-width: 0; }
  .benefit-title { font-size: 13.5px; font-weight: 700; }
  .benefit-desc { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .benefit-row.disabled .benefit-title, .benefit-row.disabled .benefit-desc { color: var(--disabled-ink); }

  .go-btn {
    flex: 0 0 auto; border: none; border-radius: 999px; padding: 9px 14px;
    font-size: 12.5px; font-weight: 700; color: #fff; cursor: pointer; white-space: nowrap;
    transition: transform 120ms ease;
  }
  .go-btn:active { transform: scale(0.95); }
  .benefit-row.disabled .go-btn { background: var(--disabled); color: var(--disabled-ink); cursor: default; }

  .toast {
    position: absolute; left: 50%; bottom: 100px; transform: translate(-50%, 8px);
    background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px;
    font-size: 12.5px; font-weight: 600; opacity: 0; pointer-events: none;
    transition: opacity 200ms ease, transform 200ms ease; z-index: 60; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- onboarding overlay ---------- */
  .onboarding {
    position: absolute; top: 44px; left: 0; right: 0; bottom: 0;
    background: var(--paper); z-index: 80;
    display: flex; flex-direction: column; justify-content: center;
    padding: 28px 26px; transition: opacity 240ms ease, visibility 240ms ease;
  }
  .onboarding.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .ob-hero { font-size: 40px; margin-bottom: 8px; }
  .ob-title { font-size: 21px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.01em; text-wrap: balance; }
  .ob-sub { font-size: 13px; color: var(--muted); line-height: 1.55; margin: 0 0 22px; }
  .ob-cta {
    border: none; background: var(--teal); color: #fff; font-weight: 800; font-size: 14.5px;
    padding: 14px; border-radius: 16px; cursor: pointer; margin-top: 20px; width: 100%;
  }

  @media (prefers-reduced-motion: reduce) {
    .sheet, .sheet-backdrop, .toast, .chip, .go-btn, .pin, .onboarding, .carrier-card { transition: none !important; }
  }
</style>

<div class="stage">
  <div class="stage-label">혜택맵 · 프로토타입</div>
  <div class="phone">
    <div class="screen">
      <div class="notch"></div>

      <div class="statusbar">
        <span>9:41</span>
        <div class="icons">

<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=040ed84d60a3ea415b9f5e666aaf7ee9&libraries=services&autoload=false"></script>
<script>
  const CARRIER_META = {
    SKT: { label: 'SKT', full: 'T멤버십', color: 'var(--skt)' },
    KT:  { label: 'KT',  full: 'KT 멤버십', color: 'var(--kt)' },
    LGU: { label: 'U+',  full: 'U+멤버십', color: 'var(--lgu)' },
  };
  const CARRIER_KEYS = ['SKT', 'KT', 'LGU'];
  const CHECK_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

  // 혜택 탭(리스트) 데이터 — 좌표가 필요 없어서 크롤러가 갱신하는
  // docs/data/places.json 을 fetch로 그대로 불러와 쓴다.
  let BENEFIT_DATA = [];
  let BENEFIT_DATA_IS_LIVE = false;
  let LIVE_ID_SEQ = 0;

  function getCategories() { return ['전체', ...new Set(BENEFIT_DATA.map(p => p.cat).filter(Boolean))]; }

  const CATEGORY_ORDER = ['상시혜택', '월간혜택', 'VIP특화혜택'];

  function groupByCategory(rawBenefits) {
    // {SKT:{category,tier,summary,all:[...]}|null, KT:..., LGU:...} -> {상시혜택:{SKT:[{tier,summary}],...}, ...}
    const groups = {};
    CATEGORY_ORDER.forEach(c => { groups[c] = {}; });
    CARRIER_KEYS.forEach((carrier) => {
      const c = rawBenefits[carrier];
      if (!c) return;
      const lines = (c.all && c.all.length) ? c.all : [c];
      lines.forEach((line) => {
        if (!groups[line.category]) return;
        (groups[line.category][carrier] = groups[line.category][carrier] || []).push({ tier: line.tier, summary: line.summary });
      });
    });
    return groups;
  }

  async function loadLiveBenefitData() {
    try {
      const res = await fetch('./data/places.json', { cache: 'no-store' });
      if (!res.ok) return;
      const raw = await res.json();
      if (!Array.isArray(raw) || !raw.length) return;
      BENEFIT_DATA = raw.map(entry => ({
        id: 'brand-' + (LIVE_ID_SEQ++),
        name: entry.brand,
        cat: entry.category_group || '기타',
        glyph: '🏷️',
        dist: '',
        benefits: { SKT: !!entry.benefits.SKT, KT: !!entry.benefits.KT, LGU: !!entry.benefits.LGU },
        byCategory: groupByCategory(entry.benefits),
      }));
      BENEFIT_DATA_IS_LIVE = true;
      benefitCategory = '전체';
      if (currentView === 'benefits') renderBenefitTab();
    } catch (e) {
      console.warn('실데이터 로드 실패', e);
    }
  }

  function findBrandByName(placeName) {
    // 카카오맵 검색결과 place_name(예: "스타벅스 강남역점") 안에 브랜드명이 포함되는지로 매칭.
    // 가장 긴 브랜드명이 우선(예: "GS THE FRESH"가 "GS25"보다 먼저 매칭되도록).
    let best = null;
    for (const b of BENEFIT_DATA) {
      if (b.name && placeName.includes(b.name) && (!best || b.name.length > best.name.length)) best = b;
    }
    return best;
  }

  function findAnyPlace(id) {
    return RAW_MATCHES.find(p => p.id === id) || BENEFIT_DATA.find(p => p.id === id);
  }

  // ---- state ----
  let activeCarriers = new Set(); // 비어있으면 "전체"(필터 없음)
  let selectedId = null;
  let query = '';
  let mapMode = 'map';
  let currentView = 'map';
  let benefitCategory = '전체';
  const myCarriers = new Set();
  const favorites = new Set();

  // ---- element refs ----
  const mapEl = document.getElementById('map');
  const chipsEl = document.getElementById('chips');
  const sheetEl = document.getElementById('sheet');
  const backdropEl = document.getElementById('backdrop');
  const sheetContentEl = document.getElementById('sheetContent');
  const searchEl = document.getElementById('search');
  const resultCountEl = document.getElementById('resultcount');
  const toastEl = document.getElementById('toast');
  const viewToggleEl = document.getElementById('viewToggle');
  const viewToggleLabelEl = document.getElementById('viewToggleLabel');
  const listpanelEl = document.getElementById('listpanel');
  const tabbarEl = document.getElementById('tabbar');
  const benefitCatChipsEl = document.getElementById('benefitCatChips');
  const benefitListEl = document.getElementById('benefitList');
  const myCarrierCardsEl = document.getElementById('myCarrierCards');
  const favCountEl = document.getElementById('favCount');
  const favListEl = document.getElementById('favList');
  const obCardsEl = document.getElementById('obCards');
  const obConfirmEl = document.getElementById('obConfirm');
  const onboardingEl = document.getElementById('onboarding');

  // ---- helpers ----
  function visibleCarrierKeys() {
    return activeCarriers.size === 0 ? CARRIER_KEYS : CARRIER_KEYS.filter(k => activeCarriers.has(k));
  }
  function matchesFilter(place) {
    const carrierOk = visibleCarrierKeys().some(k => place.benefits[k]);
    const q = query.trim().toLowerCase();
    const queryOk = !q || place.name.toLowerCase().includes(q) || place.cat.toLowerCase().includes(q);
    return carrierOk && queryOk;
  }
  function placeMatchesMine(place) { return [...myCarriers].some(k => place.benefits[k]); }
  function sortedPlaces(list) {
    if (myCarriers.size === 0) return list;
    return [...list].sort((a, b) => (placeMatchesMine(a) ? 0 : 1) - (placeMatchesMine(b) ? 0 : 1));
  }
  function carrierCardHtml(key, selected) {
    const m = CARRIER_META[key];
    return `<button class="carrier-card ${selected ? 'selected' : ''}" data-carrier="${key}" style="--c:${m.color}">
      <span class="cc-badge" style="background:${m.color}">${m.label}</span>
      <span class="cc-name">${m.full}</span>
      <span class="cc-check">${selected ? CHECK_SVG : ''}</span>
    </button>`;
  }

  // ---- 카카오맵: 실제 지도 + 화면 범위 내 카테고리 검색으로 제휴 매장 찾기 ----
  const CATEGORY_CODES = ['FD6', 'CE7', 'CS2', 'CT1', 'MT1']; // 음식점/카페/편의점/문화시설/대형마트
  let kakaoMap = null;
  let userLatLng = null;
  let RAW_MATCHES = [];       // 화면에 필터 적용 전, 마지막 검색 결과 전체
  let currentOverlays = [];   // 현재 지도에 올려진 CustomOverlay들
  let searchSeq = 0;

  function haversineM(lat1, lon1, lat2, lon2) {
    const R = 6371000, toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  function formatDistance(m) { return m < 1000 ? `${Math.round(m)}m` : `${(m / 1000).toFixed(1)}km`; }

  function initKakaoMap() {
    if (typeof kakao === 'undefined' || !kakao.maps) {
      document.getElementById('mapLoading').textContent = '지도를 불러오지 못했어요 (카카오맵 SDK 로드 실패)';
      return;
    }
    kakao.maps.load(() => {
      const defaultCenter = new kakao.maps.LatLng(37.4979, 127.0276); // 강남역 (위치 권한 거부 시 기본값)
      kakaoMap = new kakao.maps.Map(document.getElementById('kakaoMap'), { center: defaultCenter, level: 4 });
      document.getElementById('mapLoading').classList.add('hidden');

      kakao.maps.event.addListener(kakaoMap, 'idle', searchNearbyMatches);

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          userLatLng = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
          kakaoMap.setCenter(userLatLng);
        }, () => {}, { timeout: 6000 });
      }

      document.querySelector('.fab.locate').addEventListener('click', () => {
        if (userLatLng) kakaoMap.setCenter(userLatLng);
      });
      document.querySelector('.fab.zoomin').addEventListener('click', () => kakaoMap.setLevel(kakaoMap.getLevel() - 1));
      document.querySelector('.fab.zoomout').addEventListener('click', () => kakaoMap.setLevel(kakaoMap.getLevel() + 1));

      searchNearbyMatches();
    });
  }

  function searchNearbyMatches() {
    if (!kakaoMap || BENEFIT_DATA.length === 0) return;
    const mySeq = ++searchSeq;
    const places = new kakao.maps.services.Places();
    const bounds = kakaoMap.getBounds();
    const found = new Map();
    let pending = CATEGORY_CODES.length;

    CATEGORY_CODES.forEach((code) => {
      places.categorySearch(code, (data, status) => {
        if (mySeq !== searchSeq) return; // 그 사이 지도가 또 움직였으면 낡은 응답 무시
        if (status === kakao.maps.services.Status.OK) {
          data.forEach((item) => {
            const brand = findBrandByName(item.place_name);
            if (!brand || found.has(item.id)) return;
            found.set(item.id, { brand, placeName: item.place_name, lat: parseFloat(item.y), lng: parseFloat(item.x) });
          });
        }
        pending--;
        if (pending === 0) renderMatchedMarkers([...found.values()]);
      }, { bounds });
    });
  }

  function renderMatchedMarkers(rawList) {
    RAW_MATCHES = rawList.map((m) => {
      const distM = userLatLng ? haversineM(userLatLng.getLat(), userLatLng.getLng(), m.lat, m.lng) : null;
      return {
        id: 'kko-' + m.brand.id + '-' + Math.round(m.lat * 1e5) + '-' + Math.round(m.lng * 1e5),
        name: m.placeName,
        brandName: m.brand.name,
        cat: m.brand.cat,
        glyph: m.brand.glyph,
        dist: distM != null ? formatDistance(distM) : '',
        _distM: distM,
        benefits: m.brand.benefits,
        byCategory: m.brand.byCategory,
        _lat: m.lat, _lng: m.lng,
      };
    }).sort((a, b) => (a._distM ?? Infinity) - (b._distM ?? Infinity));
    applyFilter();
  }

  function applyFilter() {
    currentOverlays.forEach((o) => o.setMap(null));
    currentOverlays = [];
    const visible = RAW_MATCHES.filter(matchesFilter);
    visible.forEach((p) => {
      const el = document.createElement('div');
      el.className = 'map-pin' + (p.id === selectedId ? ' selected' : '');
      const dots = visibleCarrierKeys().filter((k) => p.benefits[k]).map((k) => `<span style="background:${CARRIER_META[k].color}"></span>`).join('');
      el.innerHTML = `<div class="chip"><span class="chip-dots">${dots}</span><span>${p.brandName}</span></div><div class="pointer"></div>`;
      el.addEventListener('click', () => selectPlace(p.id));
      const overlay = new kakao.maps.CustomOverlay({
        position: new kakao.maps.LatLng(p._lat, p._lng),
        content: el,
        yAnchor: 1,
      });
      overlay.setMap(kakaoMap);
      currentOverlays.push(overlay);
    });
    resultCountEl.textContent = visible.length;
    if (mapMode === 'list') renderListPanel();
  }

  function renderCarrierChips() {
    chipsEl.querySelectorAll('.chip').forEach((c) => {
      const carrier = c.dataset.carrier;
      const isActive = carrier === 'ALL' ? activeCarriers.size === 0 : activeCarriers.has(carrier);
      c.classList.toggle('active', isActive);
    });
  }
  chipsEl.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const carrier = chip.dataset.carrier;
    if (carrier === 'ALL') activeCarriers.clear();
    else if (activeCarriers.has(carrier)) activeCarriers.delete(carrier);
    else activeCarriers.add(carrier);
    renderCarrierChips();
    applyFilter();
    if (currentView === 'benefits') renderBenefitTab();
  });
  searchEl.addEventListener('input', (e) => { query = e.target.value; applyFilter(); });

  // ---- 지도 <-> 리스트 토글 ----
  function setMapMode(mode) {
    mapMode = mode;
    mapEl.classList.toggle('list-mode', mode === 'list');
    viewToggleLabelEl.textContent = mode === 'list' ? '지도 보기' : '목록 보기';
    if (mode === 'list') renderListPanel();
  }
  viewToggleEl.addEventListener('click', () => setMapMode(mapMode === 'map' ? 'list' : 'map'));

  function listRowHtml(p) {
    const dots = visibleCarrierKeys().filter(k => p.benefits[k]).map(k => `<span style="background:${CARRIER_META[k].color}"></span>`).join('');
    return `<div class="listrow" data-id="${p.id}">
      <div class="lr-icon">${p.glyph}</div>
      <div class="lr-text"><div class="lr-name">${p.name}</div><div class="lr-meta">${p.cat}${p.dist ? ' · ' + p.dist : ''}</div></div>
      <div class="lr-dots">${dots}</div>
      <svg class="lr-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
    </div>`;
  }
  function renderListPanel() {
    const list = sortedPlaces(RAW_MATCHES.filter(matchesFilter));
    listpanelEl.innerHTML = list.length ? list.map(listRowHtml).join('') : `<div class="fav-empty">이 화면 범위에서 조건에 맞는 제휴사가 없어요.<br>지도를 움직이거나 축소해보세요.</div>`;
  }
  listpanelEl.addEventListener('click', (e) => {
    const row = e.target.closest('.listrow');
    if (row) selectPlace(row.dataset.id);
  });

  // ---- 바텀시트 ----
  function joinSummaries(lines) {
    const seen = new Set();
    return lines.map((l) => l.summary).filter((s) => {
      if (seen.has(s)) return false;
      seen.add(s);
      return true;
    }).join('<br>');
  }
  function benefitSectionsHtml(place) {
    const visible = visibleCarrierKeys();
    const byCategory = place.byCategory || {};
    let html = '';
    let any = false;
    CATEGORY_ORDER.forEach((cat) => {
      const rows = visible
        .filter((k) => byCategory[cat] && byCategory[cat][k] && byCategory[cat][k].length)
        .map((k) => ({ k, lines: byCategory[cat][k] }));
      if (!rows.length) return;
      any = true;
      html += `<div class="section-label">${cat}</div>`;
      rows.forEach(({ k, lines }) => {
        const meta = CARRIER_META[k];
        const summary = joinSummaries(lines);
        const tier = lines[0].tier;
        html += `
          <div class="benefit-row">
            <div class="carrier-badge" style="background:${meta.color}">${meta.label}</div>
            <div class="benefit-info">
              <div class="benefit-title">${meta.full}<span class="benefit-tier">${tier}</span></div>
              <div class="benefit-desc">${summary}</div>
            </div>
            <button class="go-btn" style="background:${meta.color}" data-carrier="${k}" data-place="${place.name}">앱 열기</button>
          </div>`;
      });
    });
    if (!any) {
      html = `<div class="fav-empty">${visible.length < CARRIER_KEYS.length ? '선택하신 통신사의 혜택 정보가 없어요' : '제공되는 혜택 정보가 없어요'}</div>`;
    }
    return html;
  }
  function selectPlace(id) {
    selectedId = id;
    const place = findAnyPlace(id);
    if (!place) return;
    if (RAW_MATCHES.some(p => p.id === id)) applyFilter();
    const isFav = favorites.has(id);
    const metaLine = place.dist ? `${place.cat} · 현재 위치에서 ${place.dist}` : place.cat;
    sheetContentEl.innerHTML = `
      <div class="place-head">
        <div class="place-icon">${place.glyph}</div>
        <div class="place-titlewrap">
          <div class="place-name">${place.name}</div>
          <div class="place-meta">${metaLine}</div>
        </div>
        <button class="fav-btn ${isFav ? 'active' : ''}" data-id="${place.id}" aria-label="즐겨찾기">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </button>
      </div>
      ${benefitSectionsHtml(place)}
    `;
    sheetEl.classList.add('open');
    backdropEl.classList.add('show');
  }
  function closeSheet() {
    sheetEl.classList.remove('open');
    backdropEl.classList.remove('show');
    selectedId = null;
    applyFilter();
  }
  backdropEl.addEventListener('click', closeSheet);

  let toastTimer = null;
  sheetContentEl.addEventListener('click', (e) => {
    const favBtn = e.target.closest('.fav-btn');
    if (favBtn) {
      const id = favBtn.dataset.id;
      if (favorites.has(id)) favorites.delete(id); else favorites.add(id);
      favBtn.classList.toggle('active');
      renderMyTab();
      return;
    }
    const btn = e.target.closest('.go-btn');
    if (!btn || btn.disabled) return;
    const meta = CARRIER_META[btn.dataset.carrier];
    toastEl.textContent = `${meta.full} 앱으로 이동합니다`;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
  });

  // ---- 혜택 탭 ----
  function benefitCardHtml(p) {
    const visible = visibleCarrierKeys();
    const byCategory = p.byCategory || {};
    let sections = '';
    CATEGORY_ORDER.forEach((cat) => {
      const tags = visible
        .filter((k) => byCategory[cat] && byCategory[cat][k] && byCategory[cat][k].length)
        .map((k) => {
          const m = CARRIER_META[k];
          const mine = myCarriers.has(k);
          const summary = joinSummaries(byCategory[cat][k]);
          return `<span class="bc-tag c-${k} ${mine ? 'mine' : ''}"><b>${m.label}</b> · ${summary}</span>`;
        }).join('');
      if (tags) sections += `<div class="bc-cat-label">${cat}</div><div class="bc-carriers">${tags}</div>`;
    });
    return `<div class="benefit-card" data-id="${p.id}">
      <div class="bc-icon">${p.glyph}</div>
      <div class="bc-body">
        <div class="bc-name">${p.name}</div>
        <div class="bc-meta">${p.dist ? `${p.cat} · ${p.dist}` : p.cat}</div>
        ${sections}
      </div>
    </div>`;
  }
  function renderBenefitTab() {
    const categories = getCategories();
    benefitCatChipsEl.innerHTML = categories.map(c => `<button class="chip ${c === benefitCategory ? 'chip-active' : ''}" data-cat="${c}">${c}</button>`).join('');
    const filtered = BENEFIT_DATA
      .filter(p => benefitCategory === '전체' || p.cat === benefitCategory)
      .filter(p => visibleCarrierKeys().some(k => p.benefits[k]));
    const list = sortedPlaces(filtered);
    benefitListEl.innerHTML = list.length ? list.map(benefitCardHtml).join('') : `<div class="fav-empty">해당 카테고리의 제휴사가 없어요</div>`;
    document.getElementById('benefitSub').textContent = (myCarriers.size
      ? '내 통신사 혜택이 있는 제휴사를 우선으로 모아봤어요'
      : '주변 제휴사 혜택을 카테고리별로 모아봤어요')
      + (BENEFIT_DATA_IS_LIVE ? ' · 통신사 공식 홈페이지 기준 실데이터' : ' · 데모 데이터');
  }
  benefitCatChipsEl.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    benefitCategory = chip.dataset.cat;
    renderBenefitTab();
  });
  benefitListEl.addEventListener('click', (e) => {
    const card = e.target.closest('.benefit-card');
    if (card) selectPlace(card.dataset.id);
  });

  // ---- MY 탭 ----
  function favRowHtml(p) {
    return `<div class="fav-row" data-id="${p.id}">
      <div class="lr-icon">${p.glyph}</div>
      <div class="lr-text"><div class="lr-name">${p.name}</div><div class="lr-meta">${p.cat}${p.dist ? ' · ' + p.dist : ''}</div></div>
      <button class="fav-remove" data-remove="${p.id}" aria-label="즐겨찾기 삭제">×</button>
    </div>`;
  }
  function renderMyTab() {
    myCarrierCardsEl.innerHTML = CARRIER_KEYS.map(k => carrierCardHtml(k, myCarriers.has(k))).join('');
    const favPlaces = RAW_MATCHES.concat(BENEFIT_DATA).filter(p => favorites.has(p.id));
    favCountEl.textContent = favPlaces.length ? `${favPlaces.length}개` : '';
    favListEl.innerHTML = favPlaces.length
      ? favPlaces.map(favRowHtml).join('')
      : `<div class="fav-empty">아직 즐겨찾기한 제휴사가 없어요.<br>지도나 혜택 탭에서 별표를 눌러 저장해보세요.</div>`;
  }
  favListEl.addEventListener('click', (e) => {
    const removeBtn = e.target.closest('.fav-remove');
    if (removeBtn) { favorites.delete(removeBtn.dataset.remove); renderMyTab(); return; }
    const row = e.target.closest('.fav-row');
    if (row) selectPlace(row.dataset.id);
  });

  // ---- 통신사 선택 (온보딩 + MY 공용) ----
  function toggleCarrier(key) {
    if (myCarriers.has(key)) myCarriers.delete(key); else myCarriers.add(key);
    activeCarriers = new Set(myCarriers); // 내 통신사 = 기본 활성 필터
    obCardsEl.innerHTML = CARRIER_KEYS.map(k => carrierCardHtml(k, myCarriers.has(k))).join('');
    renderCarrierChips();
    renderMyTab();
    renderBenefitTab();
    applyFilter();
  }
  obCardsEl.addEventListener('click', (e) => {
    const card = e.target.closest('.carrier-card');
    if (card) toggleCarrier(card.dataset.carrier);
  });
  myCarrierCardsEl.addEventListener('click', (e) => {
    const card = e.target.closest('.carrier-card');
    if (card) toggleCarrier(card.dataset.carrier);
  });
  obConfirmEl.addEventListener('click', () => onboardingEl.classList.add('hidden'));

  // ---- 탭바 ----
  function showView(view) {
    currentView = view;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + view).classList.add('active');
  }
  tabbarEl.addEventListener('click', (e) => {
    const item = e.target.closest('.tabitem');
    if (!item) return;
    tabbarEl.querySelectorAll('.tabitem').forEach(t => t.classList.remove('active'));
    item.classList.add('active');
    const view = item.dataset.view;
    if (view === 'search') {
      showView('map');
      setMapMode('list');
      setTimeout(() => searchEl.focus(), 60);
    } else if (view === 'map') {
      showView('map');
    } else {
      showView(view);
      if (view === 'benefits') renderBenefitTab();
      if (view === 'my') renderMyTab();
    }
  });

  // ---- 초기화 ----
  obCardsEl.innerHTML = CARRIER_KEYS.map(k => carrierCardHtml(k, false)).join('');
  renderCarrierChips();
  renderMyTab();
  loadLiveBenefitData().then(() => {
    renderBenefitTab();
    initKakaoMap();
  });
</script>
